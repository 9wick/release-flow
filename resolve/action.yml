name: Resolve release
description: Tell a deploy job which environment it targets, which commit to ship, and its version and release notes.
inputs:
  token:
    description: Token for the GitHub API. Needs contents write on stg to tag the version. PRs created with the default GITHUB_TOKEN do not trigger other workflows; pass a GitHub App token to run CI on them.
    default: ${{ github.token }}
  production-branch:
    description: Branch that matches production.
    default: main
  staging-branch:
    description: Branch that matches staging.
    default: stg
  staging-prerelease:
    description: Pre-release label of staging versions, as in 1.2.4-<label>.0.
    default: stg
  development-prerelease:
    description: Pre-release label of versions for other branches, as in 1.2.4-<label>.20261123050000.
    default: dev
  tag-prefix:
    description: Prefix of release tags. A release is recorded as the tag <prefix><major>.<minor>.<patch>.
    default: v
outputs:
  environment:
    description: prod for the production branch, stg for the staging branch, dev for any other branch.
  version:
    description: The release PR title on prod. On stg, the next sequential preview such as 1.2.4-stg.0, tagged by this action. On dev, a preview such as 1.2.4-dev.20261123050000. The labels follow staging-prerelease and development-prerelease.
  tag:
    description: <tag-prefix><version>. On prod, create it after a successful deploy so the next version builds on it. On stg it already exists.
  notes:
    description: The notes section of the release PR description on prod, empty otherwise.
  sha:
    description: Commit to deploy. The merge commit for a merged PR.
  pull-request-number:
    description: The release PR on prod, empty otherwise.
runs:
  using: node24
  main: main.ts
