<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title description">
  <title id="title">Standard release and hotfix branch flow</title>
  <desc id="description">In a standard release, merging a feature branch into stg opens a Release PR from stg to main. After setting the version and release notes on the Release PR and merging it into main, production deploys and tags the merge commit with v1.2.4. For a hotfix, a branch from main is merged back into main via a PR and tagged with v1.2.5 after deployment.</desc>

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .heading { font-size: 20px; font-weight: 700; fill: #172333; }
    .branch { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .caption { font-size: 14px; fill: #3a4859; }
    .caption-strong { font-size: 14px; font-weight: 700; fill: #172333; }
    .track { fill: none; stroke-width: 4; stroke-linecap: round; }
    .feature { stroke: #7a8799; }
    .staging { stroke: #245fac; }
    .production { stroke: #126851; }
    .hotfix { stroke: #c0503a; }
    .release { stroke: #72509e; stroke-dasharray: 7 7; }
    .commit { fill: #fff; stroke-width: 3; }
    .tag { fill: #fbe7b0; stroke: #a87b12; stroke-width: 1.5; }
    .tag-stem { stroke: #a87b12; stroke-width: 2; }
    .tag-text { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6e4f05; text-anchor: middle; }
    .num { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    .label { font-size: 14px; font-weight: 700; fill: #72509e; }
  </style>

  <rect x="1" y="1" width="798" height="538" rx="16" fill="#f7f9fc" stroke="#d6dfe9" stroke-width="2"/>

  <!-- Standard release -->
  <text class="heading" x="24" y="38">Standard release</text>
  <text class="branch" x="24" y="86" fill="#5b6778">feature/*</text>
  <text class="branch" x="24" y="136" fill="#245fac">stg</text>
  <text class="branch" x="24" y="206" fill="#126851">main</text>

  <path class="track staging" d="M120 130H776"/>
  <path class="track production" d="M120 200H776"/>
  <path class="track feature" d="M140 130C160 130 160 80 180 80H190C210 80 205 130 225 130"/>
  <path class="track release" d="M225 130C395 130 395 200 565 200"/>
  <text class="label" x="250" y="188">Release PR</text>

  <circle class="commit feature" cx="185" cy="80" r="6"/>
  <circle class="commit production" cx="150" cy="200" r="7"/>
  <path class="tag-stem" d="M150 180V193"/>
  <rect class="tag" x="119" y="158" width="62" height="22" rx="5"/>
  <text class="tag-text" x="150" y="173">v1.2.3</text>

  <circle cx="225" cy="130" r="12" fill="#245fac"/>
  <text class="num" x="225" y="130">1</text>
  <circle cx="395" cy="165" r="12" fill="#72509e"/>
  <text class="num" x="395" y="165">2</text>
  <path class="tag-stem" d="M565 180V188"/>
  <circle cx="565" cy="200" r="12" fill="#126851"/>
  <text class="num" x="565" y="200">3</text>
  <rect class="tag" x="534" y="158" width="62" height="22" rx="5"/>
  <text class="tag-text" x="565" y="173">v1.2.4</text>
  <circle cx="615" cy="169" r="12" fill="#a87b12"/>
  <text class="num" x="615" y="169">4</text>

  <circle cx="40" cy="245" r="12" fill="#245fac"/>
  <text class="num" x="40" y="245">1</text>
  <text class="caption-strong" x="59" y="250">Merge to stg</text>
  <text class="caption" x="59" y="272">Opens Release PR</text>

  <circle cx="228" cy="245" r="12" fill="#72509e"/>
  <text class="num" x="228" y="245">2</text>
  <text class="caption-strong" x="247" y="250">Set version &amp; notes</text>
  <text class="caption" x="247" y="272">Edit Release PR</text>

  <circle cx="416" cy="245" r="12" fill="#126851"/>
  <text class="num" x="416" y="245">3</text>
  <text class="caption-strong" x="435" y="250">Merge to main</text>
  <text class="caption" x="435" y="272">After checks pass</text>

  <circle cx="604" cy="245" r="12" fill="#a87b12"/>
  <text class="num" x="604" y="245">4</text>
  <text class="caption-strong" x="623" y="250">Deploy to prod</text>
  <text class="caption" x="623" y="272">Tags after success</text>

  <path d="M24 300H776" stroke="#d6dfe9" stroke-width="2"/>

  <!-- Hotfix -->
  <text class="heading" x="24" y="340">Hotfix</text>
  <text class="branch" x="24" y="398" fill="#126851">main</text>
  <text class="branch" x="24" y="448" fill="#c0503a">hotfix/*</text>

  <path class="track production" d="M120 392H776"/>
  <path class="track hotfix" d="M230 392C250 392 250 442 270 442H410C430 442 430 392 450 392"/>

  <circle class="commit production" cx="150" cy="392" r="7"/>
  <path class="tag-stem" d="M150 372V385"/>
  <rect class="tag" x="119" y="350" width="62" height="22" rx="5"/>
  <text class="tag-text" x="150" y="365">v1.2.4</text>

  <circle cx="300" cy="442" r="12" fill="#c0503a"/>
  <text class="num" x="300" y="442">1</text>
  <path class="tag-stem" d="M450 372V380"/>
  <circle cx="450" cy="392" r="12" fill="#126851"/>
  <text class="num" x="450" y="392">2</text>
  <rect class="tag" x="419" y="350" width="62" height="22" rx="5"/>
  <text class="tag-text" x="450" y="365">v1.2.5</text>
  <circle cx="500" cy="361" r="12" fill="#a87b12"/>
  <text class="num" x="500" y="361">3</text>

  <circle cx="40" cy="487" r="12" fill="#c0503a"/>
  <text class="num" x="40" y="487">1</text>
  <text class="caption-strong" x="59" y="492">Branch from main</text>
  <text class="caption" x="59" y="514">Commit the fix</text>

  <circle cx="228" cy="487" r="12" fill="#126851"/>
  <text class="num" x="228" y="487">2</text>
  <text class="caption-strong" x="247" y="492">Merge to main</text>
  <text class="caption" x="247" y="514">Set version &amp; notes</text>

  <circle cx="416" cy="487" r="12" fill="#a87b12"/>
  <text class="num" x="416" y="487">3</text>
  <text class="caption-strong" x="435" y="492">Deploy to prod</text>
  <text class="caption" x="435" y="514">Tags after success</text>
</svg>
